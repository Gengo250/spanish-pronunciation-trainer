[project]
name = "sptrainer"
version = "0.1.0"
description = "Interactive Spanish pronunciation trainer: flashcards, ElevenLabs reference audio, local speech assessment"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "elevenlabs>=2.0.0",
    "faster-whisper>=1.1.0",
    "onnxruntime>=1.20.0",
    "huggingface-hub>=0.26.0",
    "numpy>=2.0.0",
    "soundfile>=0.12.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sptrainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: hits a real external service (ElevenLabs); deselect with -m 'not integration'",
    "needs_model: requires the downloaded phoneme ONNX model",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# Idiomas do FastAPI: estes "defaults" sao declaracoes, nao objetos mutaveis.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.File",
    "fastapi.Form", "fastapi.Body", "fastapi.Path", "fastapi.Header",
]
